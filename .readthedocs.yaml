# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

# We use build.commands so we control the Sphinx source directory explicitly.
# RTD's built-in Sphinx integration runs `sphinx-build <repo-root>`, but our
# docs live under docs/source (master doc = docs/source/index.md), so the repo
# root is an invalid Sphinx source. With build.commands we point the source at
# docs/source and emit straight into the release root; the resulting
# index.html is produced by Sphinx itself, which keeps RTD's post-processing
# (footer injection) happy.
#
# Multi-language is handled by Read the Docs' native version model: each
# language is a separate version. conf.py reads READTHEDOCS_LANGUAGE (which
# Read the Docs sets for the version being built) and maps it to the matching
# Sphinx locale, so no language flag is needed on the command line.
build:
   os: ubuntu-22.04
   tools:
      python: "3.12"
   commands:
      - python -m pip install --upgrade pip
      - python -m pip install -r docs/requirements-docs.txt
      - sphinx-intl build -l zh_CN -d docs/source/_locale
      - sphinx-build -b html -c docs/source docs/source $READTHEDOCS_OUTPUT
