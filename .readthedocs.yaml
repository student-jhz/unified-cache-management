# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Read the Docs runs our custom build commands below so that a single build
# produces both the English and the Chinese (zh_CN) site, each under its own
# subdirectory (/en and /zh), plus a landing index that links to both.
build:
   os: ubuntu-22.04
   tools:
      python: "3.12"
   commands:
      - python -m pip install --upgrade pip
      - python -m pip install -r docs/requirements-docs.txt

      # Compile the gettext catalogs (only the .po sources are tracked).
      - sphinx-intl build -l zh_CN -d docs/source/_locale

      # English build.
      - DOCS_LANGUAGE=en sphinx-build -b html -c docs/source docs/source $READTHEDOCS_OUTPUT/en

      # Chinese build.
      - DOCS_LANGUAGE=zh_CN sphinx-build -b html -c docs/source docs/source $READTHEDOCS_OUTPUT/zh

      # Minimal language landing page (links to /en and /zh).
      - cp docs/source/_static/landing.html $READTHEDOCS_OUTPUT/index.html
