# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Build documentation in the "docs/" directory with Sphinx.
# Multi-language (English + Chinese) is handled through Read the Docs' native
# "translations" model: each language is its own version, and this same config
# builds every one of them. conf.py reads READTHEDOCS_LANGUAGE to select the
# language for the version being built, and Sphinx auto-compiles the .po
# catalogs in docs/source/_locale/zh_CN/ (gettext_auto_build defaults to true).
build:
   os: ubuntu-22.04
   tools:
      python: "3.12"

sphinx:
   configuration: docs/source/conf.py

# Packages required to build the docs (sphinx-intl is not needed at build time
# because Sphinx auto-builds the gettext catalogs, but we keep it for tooling).
python:
   install:
      - requirements: docs/requirements-docs.txt
